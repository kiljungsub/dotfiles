set -g focus-events on

# Mouse: scroll history, select panes, resize and copy with the mouse.
# Hold Shift (Option in iTerm2) for the terminal's own selection.
set -g mouse on

# Truecolor: advertise 24-bit colour to programs in panes, and tell tmux the
# outer terminal supports it
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# OSC 52: let programs in panes (e.g. Neovim) set the clipboard, and forward
# it to the outer terminal. allow-passthrough isn't needed for this.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"
